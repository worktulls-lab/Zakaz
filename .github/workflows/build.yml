name: Build KitMod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build plugin
        working-directory: KitMod
        run: mvn -B -ntp package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: KitMod-jar
          path: KitMod/target/KitMod-*.jar

      - name: Zip resource pack
        working-directory: KitMod/resourcepack
        run: zip -r ../../KitModPack.zip .

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: KitMod-resourcepack
          path: KitModPack.zip
